<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CellGuard for macOS — Battery Charge Guard</title>
  <meta name="description" content="CellGuard is a lightweight native macOS menu bar battery monitor and charge limiter for Apple Silicon MacBooks." />
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #17232c, #0c1116 65%);
      color: #f2f5f8;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      padding: 24px;
    }
    main {
      max-width: 520px;
      padding: 28px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.10);
      backdrop-filter: blur(18px);
    }
    h1 { margin: 0 0 10px; font-size: 24px; letter-spacing: -0.4px; }
    p { margin: 0 0 12px; line-height: 1.55; color: rgba(255, 255, 255, 0.78); font-size: 14.5px; }
    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(48, 209, 88, 0.16);
      color: #5ce686;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <main>
    <span class="badge">macOS Menu Bar Utility</span>
    <h1>CellGuard</h1>
    <p>CellGuard protects your MacBook battery health with configurable lower/upper charge limits, native AC pass-through holding, low-battery alerts, and automatic macOS Battery Saving Mode.</p>
    <p>Free for personal macOS use.</p>
  </main>
</body>
</html>
