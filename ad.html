<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CellGuard Sponsor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .slot {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0;
    }
    .ad-frame {
      width: 320px;
      height: 50px;
      border: 0;
      border-radius: 8px;
      overflow: hidden;
      background: transparent;
    }
    .label {
      margin-top: 2px;
      font-size: 9px;
      letter-spacing: 0.2px;
      color: rgba(255, 255, 255, 0.42);
      user-select: none;
    }
  </style>
</head>
<body>
  <div class="slot" id="ad-slot">
    <!-- AD_UNIT_START -->
    <!-- A-Ads 320x50 unit will be inserted here -->
    <!-- AD_UNIT_END -->
    <div class="label">Sponsored</div>
  </div>
</body>
</html>
